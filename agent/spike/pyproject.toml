# Dependencies of the rm_agent runtime while it runs task 1.3's spike code.
# The AgentCore CLI builds the CodeZip from this file and uv.lock beside it
# (design.md section 7). Versions match the repo's root environment, so the
# unit tests run the same Strands and AgentCore code that the runtime does.
[project]
name = "rm-agent-spike"
version = "0.1.0"
description = "Task 1.3 spike: hello-world Strands agent that calls the Flagsmith MCP tools through rm-gateway."
requires-python = ">=3.13,<3.14"
dependencies = [
    "bedrock-agentcore==1.28.0",
    "strands-agents==1.67.0",
    "boto3==1.44.12",
    "botocore[crt]==1.44.12",
    "mcp-proxy-for-aws==2.0.0",
    # The CLI starts the entrypoint under opentelemetry-instrument by default.
    "aws-opentelemetry-distro~=0.21.0",
]

[tool.uv]
# Not a package: the CLI copies this directory's files into the CodeZip as they are.
package = false
